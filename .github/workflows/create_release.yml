name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release (also selectable as a ref in the run dialog); defaults to the chosen ref'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Fork release flow, replacing the upstream one (decision: knowledge base,
# decisions/tag-triggered-dll-release.md). Upstream's workflow fired on manual dispatch only, cut the
# release tag from the Cargo version (this fork keeps the Cargo version at the upstream base and puts
# its identity in `v<base>-fork.N` tags, which that scheme cannot spell), and shipped an Android .so
# plus an installer chain that downloads its own previous release's assets. A fork release carries
# what the in-game updater and the player both expect: `cri_mana_vpx.dll` (C4) and its sha256.
# Pushing a `v*` tag is the release; the dispatch input exists to re-run for a tag without moving it.
# Android is not a gate on this fork (AGENTS.md section 1), so nothing here builds for it.

jobs:
  windows:
    name: Build and release (Windows)
    runs-on: windows-latest
    # A [ci skip] commit may not push a release; a dispatch run has no head commit to read.
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ci skip]')

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-windows

      # The host triple on a windows runner is x86_64-pc-windows-msvc, so this is the release
      # command from AGENTS.md section 4 verbatim. A plain checkout is not dirty, so build.rs
      # embeds v<CARGO_PKG_VERSION>-<short sha> without the -dirty suffix.
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage the release asset
        shell: bash
        run: |
          set -euo pipefail
          cp target/x86_64-pc-windows-msvc/release/hachimi.dll cri_mana_vpx.dll
          sha256sum cri_mana_vpx.dll | cut -d' ' -f1 > cri_mana_vpx.dll.sha256

      # Notes: RELEASE_NOTES.md at the tag wins, so the hand-written release text can be committed
      # with the release-prep commit; without it GitHub generates notes from the merged commits.
      - name: Publish
        shell: bash
        env:
          # gh refuses GITHUB_TOKEN inside Actions and demands GH_TOKEN by name.
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) echo "not a version tag: $TAG (dispatch needs the version input or a tag ref)"; exit 1 ;; esac
          if [ -f RELEASE_NOTES.md ]; then
            gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" \
              --notes-file RELEASE_NOTES.md cri_mana_vpx.dll cri_mana_vpx.dll.sha256
          else
            gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" \
              --generate-notes cri_mana_vpx.dll cri_mana_vpx.dll.sha256
          fi
