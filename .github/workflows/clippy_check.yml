name: Clippy Check And Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            target: x86_64-pc-windows-msvc
        # The aarch64-linux-android leg was dropped by decision (knowledge/decisions/
        # android-is-not-a-gate-on-this-fork.md). This fork is played on the Windows Global client,
        # the Windows release build never compiles src/android (src/lib.rs gates the module), and the
        # leg cost an NDK environment setup per run for code the shipped DLL does not contain.
        # src/android, the slot tables and their tests are unchanged. Restoring the leg is one matrix
        # entry plus the two steps that were removed with it.

    steps:
      - uses: actions/checkout@v7

      - name: Check path changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code_changed:
              - 'src/**'
              - 'assets/locales/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'

      - name: Install Rust
        if: steps.filter.outputs.code_changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.code_changed == 'true'
        with:
          prefix-key: ${{ matrix.target }}

      - name: Setup Windows MSVC Cross-Compile Tools
        if: steps.filter.outputs.code_changed == 'true' && matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          sudo apt install -y llvm lld
          sudo ln -sf /usr/bin/llvm-ar /usr/local/bin/llvm-lib

      - name: Install cargo-xwin
        if: steps.filter.outputs.code_changed == 'true' && matrix.target == 'x86_64-pc-windows-msvc'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin@0.23.1

      - name: Cache cargo-xwin MSVC CRT & Windows SDK
        if: steps.filter.outputs.code_changed == 'true' && matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/cache@v6
        with:
          path: ~/.cache/cargo-xwin
          key: ${{ runner.os }}-xwin-cache-v1

      - name: Run Clippy (Windows)
        if: steps.filter.outputs.code_changed == 'true' && matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo xwin clippy --target ${{ matrix.target }} -- -D warnings
        # The android only modules and their #[cfg(test)] modules are behind cfg(target_os = "android")
        # and are not compiled by this leg. They were linted by the dropped Android job (C42); running
        # them locally needs the NDK names recorded in AGENTS.md section 4.

  # The hook tests in `src/il2cpp/hook/**/tests` are what the ledger cites as verification for
  # C33 to C40, and nothing ran them: clippy compiling a `#[cfg(test)]` module is not running it.
  # They are host tests, the crate only builds for Windows and Android, so they run on a Windows
  # runner instead of cross compiling like the clippy jobs above.
  unit_tests:
    name: Unit tests (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check path changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code_changed:
              - 'src/**'
              - 'assets/locales/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'

      - name: Install Rust
        if: steps.filter.outputs.code_changed == 'true'
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.code_changed == 'true'
        with:
          prefix-key: test

      - name: Run unit tests
        if: steps.filter.outputs.code_changed == 'true'
        run: cargo test --lib
